name: Generate Live Profile & Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Generate the animated snake eating your contribution grid
      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: liyan-nk
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#E5A93C&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/github-snake-dark.svg?palette=github-dark

      # 2. Push generated SVGs to an isolated output branch
      - name: Deploy Animated SVGs to GitHub Pages / Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Auto-update Recent Commits / Activity directly in README
      - name: Update Recent Activity
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "RECENT_ACTIVITY"
          commit_message: "chore(telemetry): automated profile activity sync [skip ci]"
          gh_token: ${{ secrets.GITHUB_TOKEN }}
